{% extends "base.html" %}

{% block title %}Devices - USB/IP ESP32 Client{% endblock %}

{% block content %}
<h2>Devices</h2>

<table id="devices-table">
    <thead>
        <tr>
            <th>Name</th>
            <th>Server</th>
            <th>Port</th>
            <th>Bus ID</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        <tr><td colspan="6" class="loading">Loading...</td></tr>
    </tbody>
</table>

<div id="action-result" class="hidden"></div>
{% endblock %}

{% block scripts %}
<script>
(function() {
    const ingressPath = "{{ ingress_path }}";

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    function showResult(message, isError) {
        const el = document.getElementById('action-result');
        el.textContent = message;
        el.className = isError ? 'result-error' : 'result-ok';
        setTimeout(function() { el.className = 'hidden'; }, 5000);
    }

    function attachDevice(server) {
        fetch(ingressPath + '/api/attach', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({server: server})
        })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (data.success) {
                showResult('Attached ' + data.device + ' to port ' + data.port, false);
            } else {
                showResult('Attach failed: ' + (data.error || 'Unknown error'), true);
            }
        })
        .catch(function(e) { showResult('Request failed: ' + e.message, true); });
    }

    function detachDevice(port) {
        fetch(ingressPath + '/api/detach', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({port: port})
        })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (data.success) {
                showResult('Detached port ' + data.port, false);
            } else {
                showResult('Detach failed: ' + (data.error || 'Unknown error'), true);
            }
        })
        .catch(function(e) { showResult('Request failed: ' + e.message, true); });
    }

    // Expose to onclick handlers
    window.attachDevice = attachDevice;
    window.detachDevice = detachDevice;

    function renderDevices(data) {
        const tbody = document.querySelector('#devices-table tbody');
        if (!data.devices || data.devices.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6">No devices configured</td></tr>';
            return;
        }
        tbody.innerHTML = data.devices.map(function(d) {
            const statusClass = d.attached ? 'status-ok' : 'status-error';
            const statusText = d.attached ? 'Attached' : 'Detached';
            let actions = '';
            if (d.attached) {
                actions = '<button onclick="detachDevice(' + d.attached_port + ')">Detach</button>';
            } else {
                actions = '<button onclick="attachDevice(\'' + escapeHtml(d.server) + '\')">Attach</button>';
            }
            return '<tr>' +
                '<td>' + escapeHtml(d.name) + '</td>' +
                '<td>' + escapeHtml(d.server) + '</td>' +
                '<td>' + d.port + '</td>' +
                '<td>' + escapeHtml(d.busid) + '</td>' +
                '<td class="' + statusClass + '">' + statusText + '</td>' +
                '<td>' + actions + '</td>' +
                '</tr>';
        }).join('');
    }

    UsbipPolling.start(ingressPath + '/api/status', renderDevices, 5000);
})();
</script>
{% endblock %}
